[project]
name = "app-gasolineras"
version = "0.1.0"
description = "Mapa de gasolineras en México: precios, rutas, paradas de recarga y geocercas"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
vrp = ["ortools>=9.10"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["geo*", "pipeline*", "routing*"]

[tool.setuptools.package-data]
routing = ["static/*.html"]
