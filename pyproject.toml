[project]
name = "app-gasolineras"
version = "0.1.0"
description = "Mapa de gasolineras en México: precios, rutas, paradas de recarga y geocercas"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
vrp = ["ortools>=9.10"]
# Opcional: similitud de nombres más precisa en el cruce CNE/OSM/DENUE (sin ella se usa difflib)
datos = ["rapidfuzz>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "geo", "routing"]
